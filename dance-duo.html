eg{to{transform:rotate(25deg)}}@keyframes leg2{to{transform:rotate(-25deg)}}.stats{margin:18px;font-size:18px;font-weight:bold}#cue{font-size:48px;color:#ffe66d;height:60px}button{border:0;border-radius:13px;padding:13px 20px;margin:5px;background:#ffe66d;font-size:17px;font-weight:900;cursor:pointer}.pad{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:5px}.pad button{margin:0;padding:12px 0}.blank{visibility:hidden}#msg{min-height:24px;color:#ddd}</style>
<h1>🪩 우리 둘의 댄스 배틀 🪩</h1><div class="stage"><div class="people" id="people"><div class="person"><div class="label">댄서 1</div><div class="face a"></div><div class="body"></div><div class="legs"><i></i><i></i></div></div><div class="person"><div class="label">댄서 2</div><div class="face b"></div><div class="body"></div><div class="legs"><i></i><i></i></div></div></div><div class="stats">점수 <span id="score">0</span>　콤보 <span id="combo">0</span>　최고 <span id="best">0</span>　시간 <span id="time">30</span>초</div><div id="cue">READY?</div><p id="msg">시작을 누르고 리듬에 맞춰 방향키를 눌러봐!</p><button onclick="start()">▶ 게임 시작</button><button onclick="stop()">■ 멈추기</button><div class="pad"><i class="blank"></i><button onclick="hit('ArrowUp')">↑</button><i class="blank"></i><button onclick="hit('ArrowLeft')">←</button><button onclick="hit('Space')">★</button><button onclick="hit('ArrowRight')">→</button><i class="blank"></i><button onclick="hit('ArrowDown')">↓</button><i class="blank"></i></div></div><p>키보드 방향키 또는 화면 버튼으로 춤추기 · 스페이스바도 사용 가능</p>
<script>let score=0,combo=0,t=30,target='',run=false,clock,beat,best=+(localStorage.danceBest||0);document.getElementById('best').textContent=best;let keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'],icons={ArrowUp:'⬆️',ArrowDown:'⬇️',ArrowLeft:'⬅️',ArrowRight:'➡️',Space:'⭐'};function next(){target=keys[Math.random()*5|0];cue.textContent=icons[target]}function hit(k){if(!run)return;if(k===target){score+=100+combo*10;combo++;msg.textContent='완벽해! 두 사람 호흡 최고! ✨'}else{combo=0;msg.textContent='괜찮아! 다음 동작!'}document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo;next()}function start(){clearInterval(clock);clearInterval(beat);score=combo=0;t=30;run=true;document.getElementById('score').textContent=0;document.getElementById('combo').textContent=0;document.getElementById('time').textContent=t;people.classList.add('dance');next();msg.textContent='리듬에 맞춰 춤춰봐!';beat=setInterval(next,1400);clock=setInterval(()=>{document.getElementById('time').textContent=--t;if(t<=0){stop();cue.textContent='🎉 FINISH!';msg.textContent='최종 점수 '+score+'점';if(score>best){best=score;localStorage.danceBest=best;document.getElementById('best').textContent=best}}},1000)}function stop(){run=false;clearInterval(clock);clearInterval(beat);people.classList.remove('dance');}document.addEventListener('keydown',e=>{if(keys.includes(e.code)){e.preventDefault();hit(e.code)}});</script></html>
