<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAST LIGHT - 아레나 서바이벌</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101b;color:#eef6ff;font-family:system-ui,'Noto Sans KR',sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000} .top{display:flex;justify-content:space-between;padding:18px;gap:10px}.pill{background:#0b1726df;border:1px solid #8bb5d455;border-radius:12px;padding:10px 15px;font-weight:800;backdrop-filter:blur(8px)}#help{position:absolute;bottom:16px;left:16px;line-height:1.7;font-size:12px}#feed{position:absolute;top:82px;left:50%;transform:translateX(-50%);font-weight:800;color:#c8f6ff}#health{color:#8dffb0}#overlay{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#1c4560dd,#050b14f5)}.panel{width:min(620px,92vw);padding:32px;border-radius:22px;text-align:center;background:#0b1726ee;border:1px solid #a9d9ff55;box-shadow:0 25px 90px #0009}h1{font-size:clamp(40px,8vw,76px);line-height:1;margin:8px 0;color:#b8f2ff;letter-spacing:4px}p{color:#c4d5e5;line-height:1.8}button{pointer-events:auto;border:0;border-radius:12px;padding:14px 28px;background:linear-gradient(100deg,#9cf5db,#8dd5ff);font-size:17px;font-weight:900;cursor:pointer;color:#071522}#result{display:none;position:fixed;inset:0;z-index:5;place-items:center;background:#050b14df}.small{font-size:13px;color:#91a9bf}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div class="pill">❤ <span id="health">100</span></div><div class="pill">생존 <span id="alive">12</span>명</div><div class="pill">에너지 <span id="ammo">∞</span></div><div class="pill">시간 <span id="time">00:00</span></div></div><div id="feed"></div><div id="help" class="pill">WASD 이동 · 마우스 조준 · 클릭: 에너지 발사<br>Shift: 빠르게 이동 · 파란 구역 안에서 생존하세요</div></div>
<div id="overlay"><section class="panel"><div class="small">ARCADE SURVIVAL ARENA</div><h1>LAST LIGHT</h1><p>12명의 참가자가 신비한 아레나에서 최후까지 살아남는 게임!<br>현실 무기가 아닌 빛 에너지 볼트를 발사하고, 점점 좁아지는 안전 구역 안에서 버텨 보세요.</p><p class="small">WASD 이동 · 마우스 조준 · 클릭 발사 · Shift 질주</p><button id="start">게임 시작</button></section></div>
<div id="result"><section class="panel"><div class="small">ARENA REPORT</div><h1 id="resultTitle">WINNER!</h1><p id="resultText"></p><button id="again">다시 도전</button></section></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr,keys={},mouse={x:0,y:0,down:false},player,bots,shots,particles,zone,elapsed=0,running=false,last=0,feedTimer=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function say(s){document.getElementById('feed').textContent=s;feedTimer=2}
function start(){player={x:W/2,y:H/2,r:14,hp:100,speed:245,cool:0,hit:0};bots=[];shots=[];particles=[];elapsed=0;zone={x:W/2,y:H/2,r:Math.min(W,H)*.48,target:Math.min(W,H)*.16};for(let i=0;i<11;i++){let a=rand(0,Math.PI*2),r=rand(Math.min(W,H)*.2,Math.min(W,H)*.47);bots.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,r:13,hp:60,speed:rand(70,105),cool:rand(.2,1.5),phase:rand(0,6),alive:true})}running=true;document.getElementById('overlay').style.display='none';document.getElementById('result').style.display='none';say('안전 구역으로 이동하세요!')}
function bolt(x,y,dx,dy,team){shots.push({x,y,vx:dx*570,vy:dy*570,life:1.4,team,r:5})}
function burst(x,y,color){for(let i=0;i<9;i++){let a=rand(0,Math.PI*2),s=rand(35,150);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.55),color})}}
function shoot(){if(player.cool>0)return;let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bolt(player.x+Math.cos(a)*18,player.y+Math.sin(a)*18,Math.cos(a),Math.sin(a),'player');player.cool=.22}
function end(win){running=false;document.getElementById('result').style.display='grid';document.getElementById('resultTitle').textContent=win?'ARENA CHAMPION':'GAME OVER';document.getElementById('resultText').textContent=win?'모든 상대를 제치고 최후의 생존자가 되었습니다!':'다음 경기에서는 안전 구역과 주변을 잘 살펴보세요.'}
function update(dt){if(!running)return;elapsed+=dt;player.cool=Math.max(0,player.cool-dt);player.hit=Math.max(0,player.hit-dt);let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(dx,dy)||1,s=player.speed*(keys.shift?1.35:1);player.x=clamp(player.x+dx/len*s*dt,18,W-18);player.y=clamp(player.y+dy/len*s*dt,18,H-18);if(mouse.down)shoot();
zone.r=Math.max(zone.target,zone.r-dt*5.2);let outside=Math.hypot(player.x-zone.x,player.y-zone.y)>zone.r;if(outside){player.hp-=dt*12;if(Math.floor(elapsed*2)%2===0)say('안전 구역 밖입니다!')}if(player.hp<=0){end(false);return}
for(const b of bots){if(!b.alive)continue;b.cool-=dt;b.phase+=dt;let d=dist(b,player),a=Math.atan2(player.y-b.y,player.x-b.x);if(d>190){b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt}else if(d<115){b.x-=Math.cos(a)*b.speed*.55*dt;b.y-=Math.sin(a)*b.speed*.55*dt}else{b.x+=Math.cos(a+Math.PI/2)*Math.sin(b.phase)*b.speed*.45*dt;b.y+=Math.sin(a+Math.PI/2)*Math.sin(b.phase)*b.speed*.45*dt}b.x=clamp(b.x,15,W-15);b.y=clamp(b.y,15,H-15);if(b.cool<=0&&d<430){bolt(b.x,b.y,Math.cos(a),Math.sin(a),'bot');b.cool=rand(1.1,1.8)}if(Math.hypot(b.x-zone.x,b.y-zone.y)>zone.r){b.hp-=dt*8;if(b.hp<=0){b.alive=false;burst(b.x,b.y,'#ffb36b')}}}
for(let i=shots.length-1;i>=0;i--){let q=shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let remove=q.life<=0||q.x<0||q.x>W||q.y<0||q.y>H;if(!remove&&q.team==='player'){for(const b of bots){if(b.alive&&Math.hypot(q.x-b.x,q.y-b.y)<b.r+q.r){b.hp-=35;burst(q.x,q.y,'#8deaff');if(b.hp<=0){b.alive=false;burst(b.x,b.y,'#ffb36b');say('상대 한 명 탈락!')}remove=true;break}}}else if(!remove&&q.team==='bot'&&Math.hypot(q.x-player.x,q.y-player.y)<player.r+q.r){player.hp-=9;player.hit=.15;burst(q.x,q.y,'#ff8b9b');remove=true}if(remove)shots.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
let alive=bots.filter(b=>b.alive).length+1;document.getElementById('health').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('alive').textContent=alive;document.getElementById('time').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');if(alive===1)end(true);if(feedTimer>0){feedTimer-=dt;if(feedTimer<=0)document.getElementById('feed').textContent=''}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#142c2b';ctx.fillRect(0,0,W,H);let tile=54;for(let y=0;y<H;y+=tile)for(let x=0;x<W;x+=tile){ctx.fillStyle=((x/tile+y/tile)%2===0)?'#183632':'#1b3b35';ctx.fillRect(x,y,tile-1,tile-1)}for(let i=0;i<36;i++){let x=(i*197)%W,y=(i*113)%H;ctx.fillStyle='#8ac6a122';ctx.beginPath();ctx.arc(x,y,randStatic(i,4,13),0,Math.PI*2);ctx.fill()}
ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2,true);ctx.fillStyle='#07101bb8';ctx.fill('evenodd');ctx.restore();ctx.beginPath();ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);ctx.strokeStyle='#73dfff';ctx.lineWidth=3;ctx.setLineDash([12,8]);ctx.stroke();ctx.setLineDash([]);
for(const b of bots)if(b.alive){ctx.fillStyle='#ffb36b';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38251d';ctx.fillRect(b.x-8,b.y-3,5,3);ctx.fillRect(b.x+3,b.y-3,5,3);ctx.fillStyle='#402a24';ctx.fillRect(b.x-15,b.y-23,30,4);ctx.fillStyle='#8affae';ctx.fillRect(b.x-15,b.y-23,30*Math.max(0,b.hp/60),4)}
for(const q of shots){ctx.shadowBlur=15;ctx.shadowColor=q.team==='player'?'#79e9ff':'#ff8d9c';ctx.fillStyle=q.team==='player'?'#b8f6ff':'#ff9cab';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
if(player){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(mouse.y-player.y,mouse.x-player.x));ctx.fillStyle='#54d9ff';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8fbff';ctx.fillRect(5,-5,19,10);ctx.restore();ctx.strokeStyle=player.hit?'#ff637c':'#b9f4ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,Math.PI*2);ctx.stroke()}
ctx.fillStyle='#dff8ff';ctx.font='12px system-ui';ctx.fillText('SAFE ZONE',zone.x-zone.r+12,zone.y-zone.r+22)}
function randStatic(i,a,b){let n=Math.sin(i*78.233)*43758.5453;return a+(n-Math.floor(n))*(b-a)}
function loop(t){let dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('pointerdown',()=>mouse.down=true);addEventListener('pointerup',()=>mouse.down=false);document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
})();
</script></body></html>
